<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đang xác thực Discord...</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0a1a0f;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    flex-direction: column;
    gap: 16px;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(34,197,94,.2);
    border-top-color: #4ade80;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { font-size: 14px; color: #94a3b8; }
  .err { color: #fca5a5; font-size: 13px; max-width: 300px; text-align: center; }
</style>
</head>
<body>
<div class="spinner" id="spinner"></div>
<div class="msg" id="msg">Đang xác minh danh tính với Discord...</div>

<script>
// ══════════════════════════════════════════
//   CALLBACK PAGE — Nhận OAuth token từ
//   Supabase Discord và gửi về opener (index.html)
// ══════════════════════════════════════════
const SUPABASE_URL  = 'https://bzmcxkgyfzpswmtxdxyl.supabase.co';
const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6bWN4a2d5Znpwc3dtdHhkeHlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM3NzU2NjEsImV4cCI6MjA1OTM1MTY2MX0.fVbt2tE5RBfItIBi2l3MBKJL_6DMDvBPFZzlkFjXHDY';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ── Hàm xử lý khi có session ──
function handleSession(session) {
  if (window.hasHandledSession) return;
  window.hasHandledSession = true;

  document.getElementById('msg').textContent = '✅ Đã xác thực! Đang quay về...';

  if (window.opener) {
    window.opener.postMessage({
      type: 'DISCORD_AUTH_SUCCESS',
      session: {
        access_token:  session.access_token,
        refresh_token: session.refresh_token,
        expires_at:    session.expires_at,
        user:          session.user
      }
    }, window.location.origin);
    setTimeout(() => window.close(), 600);
  } else {
    window.location.href = './index.html';
  }
}

// ── Xử lý URL hash và query trực tiếp (Fix lỗi onAuthStateChange không fire SIGNED_IN) ──
const hashStr = window.location.hash.substring(1);
const hashParams = new URLSearchParams(hashStr);
const queryParams = new URLSearchParams(window.location.search);

// Bắt lỗi nếu user ấn Hủy / Cancel trên Discord (tránh bị timeout 10s)
if (hashParams.has('error') || queryParams.has('error')) {
  let errorMsg = hashParams.get('error_description') || hashParams.get('error') 
              || queryParams.get('error_description') || queryParams.get('error') || 'Đăng nhập bị từ chối';
  errorMsg = decodeURIComponent(errorMsg).replace(/\+/g, ' ');
  console.warn('[Callback] Lỗi từ OAuth:', errorMsg);
  
  document.getElementById('spinner').style.display = 'none';
  const msgEl = document.getElementById('msg');
  msgEl.style.color = '#fca5a5';
  msgEl.textContent = '❌ Lỗi: ' + errorMsg;

  if (window.opener) {
    window.opener.postMessage({
      type: 'DISCORD_AUTH_ERROR',
      error: errorMsg
    }, window.location.origin);
    setTimeout(() => window.close(), 3000);
  } else {
    setTimeout(() => window.location.href = './index.html', 3000);
  }
} 
else {
  // Xử lý access_token bình thường bằng getSession (Supabase sẽ tự parse URL hash)
  sb.auth.getSession().then(({ data, error }) => {
    if (data?.session) {
      console.log('[Callback] getSession trực tiếp thành công');
      handleSession(data.session);
    }
  });
}

// ── Dùng listener phòng trường hợp dự phòng ──
sb.auth.onAuthStateChange((event, session) => {
  console.log('[Callback] Auth event:', event);
  if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session) {
    handleSession(session);
  }
});

// Timeout 10s — nếu không nhận được SIGNED_IN thì báo lỗi
setTimeout(() => {
  const msgEl = document.getElementById('msg');
  if (msgEl.textContent.includes('Đang xác minh')) {
    document.getElementById('spinner').style.display = 'none';
    msgEl.style.color = '#fca5a5';
    msgEl.textContent = '❌ Hết thời gian xác thực. Vui lòng thử lại.';
    if (window.opener) {
      window.opener.postMessage({
        type: 'DISCORD_AUTH_ERROR',
        error: 'Timeout — không nhận được session'
      }, window.location.origin);
    }
    setTimeout(() => window.close(), 3000);
  }
}, 10000);
</script>
</body>
</html>
