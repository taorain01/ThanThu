<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lang Gia - Redesign A — Hero Coin</title>
<meta name="description" content="Hệ thống quản lý bang chiến Guild Lang Gia - Where Winds Meet">
<link rel="icon" type="image/png" href="./anh/langgia_icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --green-300:#86efac;--green-400:#4ade80;--green-500:#22c55e;--green-600:#16a34a;
  --gold:#fbbf24;--gold-deep:#f59e0b;--gold-dark:#d97706;--gold-glow:#fde68a;
  --bg:#060e09;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  display:flex;align-items:center;justify-content:center;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}

/* ═══ LANDING ═══ */
.landing{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
  overflow:hidden}

/* ── Background layers ── */
.landing-bg{position:absolute;inset:0;z-index:0}
.landing-map{position:absolute;inset:-40px;z-index:0;
  background:url('./anh/LangGia2.png') center/cover no-repeat;
  filter:blur(0px) brightness(0.5) saturate(1.15);
  transform:scale(1.08);
  animation:bgBreath 20s ease-in-out infinite}
@keyframes bgBreath{0%,100%{transform:scale(1.08)}50%{transform:scale(1.12)}}

/* Vignette overlay */
.landing-bg::after{content:'';position:absolute;inset:0;z-index:1;
  background:
    radial-gradient(ellipse at 50% 35%, transparent 0%, transparent 30%, rgba(0,0,0,0.6) 70%, rgba(0,0,0,0.92) 100%),
    linear-gradient(180deg, rgba(6,14,9,0.4) 0%, transparent 30%, transparent 70%, rgba(6,14,9,0.85) 100%);
  pointer-events:none}

/* Radial glow from coin center */
.landing-glow{position:absolute;top:28%;left:50%;transform:translate(-50%,-50%);
  width:600px;height:600px;z-index:1;pointer-events:none;
  background:radial-gradient(circle, rgba(200,162,44,0.12) 0%, rgba(34,197,94,0.04) 40%, transparent 70%);
  animation:glowPulse 4s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:0.6;transform:translate(-50%,-50%) scale(0.95)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}

/* Fog layers */
.fog{position:absolute;width:200%;height:100%;z-index:2;
  background:linear-gradient(90deg,transparent,rgba(34,197,94,.04),transparent,rgba(251,191,36,.03),transparent);
  animation:fogMove 18s linear infinite;mix-blend-mode:screen}
.fog2{width:250%;top:10%;
  background:linear-gradient(90deg,transparent,rgba(200,162,44,.04),transparent,rgba(34,197,94,.03),transparent);
  animation:fogMove 28s linear infinite reverse}
@keyframes fogMove{0%{transform:translateX(-50%)}100%{transform:translateX(0)}}

/* Particles */
.particles{position:absolute;inset:0;z-index:3;overflow:hidden}
.particle{position:absolute;width:2px;height:2px;background:var(--gold-glow);border-radius:50%;opacity:0;
  animation:float 6s ease-in-out infinite}
@keyframes float{0%{opacity:0;transform:translateY(100vh)}50%{opacity:1;box-shadow:0 0 8px var(--gold-glow)}100%{opacity:0;transform:translateY(-20px)}}

/* ═══ CONTENT ═══ */
.landing-content{position:relative;z-index:10;text-align:center;max-width:640px;padding:24px 20px;
  display:flex;flex-direction:column;align-items:center}

/* ── LANG GIA Title (NEW) ── */
.hero-title{display:none;
  font-family:'Cinzel Decorative',serif;font-size:clamp(42px,8vw,78px);font-weight:900;
  background:linear-gradient(180deg,#fffdf2 0%,#f0d867 18%,#c8a22c 35%,#8b6914 52%,#c8a22c 68%,#f0d867 82%,#fffdf2 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:clamp(6px,1.5vw,14px);line-height:1.1;
  filter:drop-shadow(0 0 40px rgba(200,162,44,.5)) drop-shadow(0 4px 8px rgba(0,0,0,.8));
  margin-bottom:6px;
  position:relative;
  animation:titleAppear 1.2s cubic-bezier(.22,.68,0,1.1) both}
@keyframes titleAppear{from{opacity:0;transform:translateY(-20px) scale(0.9);filter:drop-shadow(0 0 0 transparent)}
  to{opacity:1;transform:none;filter:drop-shadow(0 0 40px rgba(200,162,44,.5)) drop-shadow(0 4px 8px rgba(0,0,0,.8))}}

/* Shine sweep on title */
.hero-title::after{content:'LANG GIA';position:absolute;left:0;top:0;width:100%;height:100%;
  background:linear-gradient(110deg, transparent 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 60%, transparent 80%);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:shineSweep 5s cubic-bezier(0.4,0,0.2,1) infinite;pointer-events:none}
@keyframes shineSweep{0%{background-position:-200% center}100%{background-position:200% center}}

/* ── Coin Scene (ENHANCED) ── */
.coin-wrapper{position:relative;margin:8px auto 0;animation:coinAppear 1s .3s cubic-bezier(.22,.68,0,1.1) both}
@keyframes coinAppear{from{opacity:0;transform:translateY(30px) scale(0.7)}to{opacity:1;transform:none}}

/* Orbital rings */
.orbital-ring{position:absolute;border-radius:50%;border:1px solid rgba(200,162,44,0.15);
  top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.orbital-ring.r1{width:280px;height:280px;animation:orbit1 12s linear infinite;
  border-color:rgba(200,162,44,0.12)}
.orbital-ring.r2{width:340px;height:340px;animation:orbit2 18s linear infinite reverse;
  border-color:rgba(34,197,94,0.08)}
.orbital-ring.r3{width:400px;height:400px;animation:orbit1 25s linear infinite;
  border-color:rgba(200,162,44,0.05)}
@keyframes orbit1{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes orbit2{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(-360deg)}}

/* Orbital dots */
.orbital-ring::before,.orbital-ring::after{content:'';position:absolute;width:4px;height:4px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 6px var(--gold),0 0 12px rgba(200,162,44,.4)}
.orbital-ring.r1::before{top:0;left:50%;transform:translate(-50%,-50%)}
.orbital-ring.r1::after{bottom:0;left:50%;transform:translate(-50%,50%)}
.orbital-ring.r2::before{top:50%;right:0;transform:translate(50%,-50%)}
.orbital-ring.r2::after{top:50%;left:0;transform:translate(-50%,-50%)}
.orbital-ring.r3::before{top:15%;right:10%;width:3px;height:3px;background:var(--green-400);box-shadow:0 0 6px var(--green-400)}
.orbital-ring.r3::after{bottom:15%;left:10%;width:3px;height:3px;background:var(--green-400);box-shadow:0 0 6px var(--green-400)}

.coin-scene{width:220px;height:220px;perspective:350px;margin:0 auto;cursor:grab;
  filter:drop-shadow(0 8px 28px rgba(120,80,0,.7)) drop-shadow(0 0 55px rgba(200,162,44,0.3))}
.coin-scene:active{cursor:grabbing}

.coin-3d{width:100%;height:100%;position:relative;transform-style:preserve-3d;will-change:transform}
.coin-face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}

.coin-face-front{
  background:linear-gradient(223deg, #463401 0%, #c5ad7c 40%, #9a803c 70%, #a79576 100%);
  box-shadow:inset 2px 2px 5px rgba(255,240,150,.4),inset -4px -4px 10px rgba(100,60,0,.6),0 4px 16px rgba(0,0,0,.5),0 0 35px rgba(200,162,44,.3)}
.coin-face-back{
  background:linear-gradient(403deg, #463401 0%, #c5ad7c 40%, #9a803c 70%, #a79576 100%);
  box-shadow:inset 2px 2px 5px rgba(255,240,150,.4),inset -4px -4px 10px rgba(100,60,0,.6),0 4px 16px rgba(0,0,0,.5);
  transform:rotateY(180deg)}
.coin-face img{width:100%;height:100%;object-fit:cover;filter:contrast(100%) brightness(112%)}
.coin-face-back img{transform:scaleX(-1)}

/* Specular sweep */
.coin-face-front::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0) 25%,rgba(255,255,255,0.5) 50%,rgba(255,255,255,0) 75%,transparent 100%);
  transform:translateX(-150%) skewX(-33deg);animation:lightSweep 3s ease-in-out infinite;z-index:4;pointer-events:none}
@keyframes lightSweep{0%{transform:translateX(-150%) skewX(-33deg)}50%{transform:translateX(150%) skewX(-33deg)}100%{transform:translateX(150%) skewX(-33deg)}}

/* Ambient occlusion */
.coin-face-front::after{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,transparent 55%,rgba(0,0,0,0.22) 75%,rgba(0,0,0,0.45) 90%,rgba(0,0,0,0.56) 100%);
  z-index:5;pointer-events:none}

/* Float idle */
.coin-3d.idle{animation:coinFloat 11.5s ease-in-out infinite}
@keyframes coinFloat{0%{transform:rotateX(10deg) rotateY(-15deg)}50%{transform:rotateX(-6deg) rotateY(12deg)}100%{transform:rotateX(10deg) rotateY(-15deg)}}

/* ── Tagline ── */
.landing-sub{font-size:clamp(13px,2vw,18px);color:var(--green-300);font-weight:300;letter-spacing:clamp(2px,0.4vw,4px);
  margin-top:16px;opacity:.75;text-transform:uppercase;
  animation:fadeUp .8s .6s cubic-bezier(.22,.68,0,1.1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:.75;transform:none}}

/* ── Divider ── */
.landing-divider{width:clamp(120px,30vw,220px);height:2px;margin:14px auto 18px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--green-400),var(--gold),transparent);
  animation:divPulse 3s ease-in-out infinite,fadeUp .8s .7s cubic-bezier(.22,.68,0,1.1) both}
@keyframes divPulse{0%,100%{opacity:.4}50%{opacity:1}}

/* ═══ GLASSMORPHISM CARD ═══ */
.login-card{
  background:linear-gradient(135deg,rgba(8,22,14,0.72),rgba(12,28,18,0.78));
  border:1px solid rgba(200,162,44,0.18);
  border-radius:24px;
  padding:28px 36px 32px;
  backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);
  box-shadow:0 24px 64px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.04),
    inset 0 1px 0 rgba(255,255,255,0.06),0 0 50px rgba(200,162,44,0.04);
  max-width:460px;width:100%;
  animation:cardAppear .8s .8s cubic-bezier(.22,.68,0,1.1) both}
@keyframes cardAppear{from{opacity:0;transform:translateY(24px) scale(0.96)}to{opacity:1;transform:none}}

/* Top glow line */
.login-card::before{content:'';position:absolute;top:0;left:15%;right:15%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,215,0,.35),rgba(255,255,255,.2),rgba(255,215,0,.35),transparent);
  border-radius:1px}

.landing-welcome{font-family:'Playfair Display',serif;font-size:clamp(16px,3vw,22px);font-weight:900;margin-bottom:4px;
  background:linear-gradient(135deg,#fff3c4,#f5c453 50%,#c8961e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 8px rgba(200,150,30,0.3));letter-spacing:1px}
.landing-flavor{font-family:'Playfair Display',serif;font-size:clamp(12px,2vw,14px);color:var(--gold-glow);font-style:italic;margin-bottom:24px;
  opacity:.85;line-height:1.6;letter-spacing:1.5px;text-shadow:0 0 8px rgba(253,230,138,0.3)}

/* ── Discord Login Button ── */
.login-btn{display:inline-flex;align-items:center;gap:12px;padding:15px 44px;
  border-radius:14px;border:2px solid var(--gold-dark);
  background:linear-gradient(135deg,rgba(251,191,36,.08),rgba(34,197,94,.06));
  color:var(--gold);font-size:16px;font-weight:700;cursor:pointer;
  transition:all .4s cubic-bezier(.25,.46,.45,.94);font-family:'Inter',sans-serif;letter-spacing:1px;
  position:relative;overflow:hidden;width:100%;justify-content:center}
.login-btn::before{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
  transform:translateX(-200%);animation:btnShine 4s ease-in-out infinite}
@keyframes btnShine{0%,100%{transform:translateX(-200%)}50%{transform:translateX(200%)}}
.login-btn:hover{
  background:linear-gradient(135deg,rgba(251,191,36,.16),rgba(34,197,94,.1));
  transform:translateY(-3px);
  box-shadow:0 8px 30px rgba(251,191,36,.25),0 0 60px rgba(251,191,36,.08);
  border-color:var(--gold)}
.login-btn:active{transform:translateY(0);box-shadow:0 2px 8px rgba(251,191,36,.15)}
.login-btn svg{width:24px;height:24px;flex-shrink:0}

/* ── Discord Join Button ── */
.discord-join-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  margin-top:12px;padding:11px 24px;border-radius:12px;font-size:13px;font-weight:700;
  cursor:pointer;text-decoration:none;font-family:'Inter',sans-serif;
  transition:all .3s ease;width:100%;
  border:1px solid rgba(88,101,242,.35);
  background:rgba(88,101,242,.08);
  color:#99a4f8;
  box-shadow:0 4px 15px rgba(0,0,0,.3)}
.discord-join-btn:hover{
  background:#5865f2;color:#fff;border-color:#5865f2;
  transform:translateY(-2px);box-shadow:0 6px 20px rgba(88,101,242,.4)}
.discord-join-btn:active{transform:translateY(0)}
.discord-join-btn svg{width:18px;height:18px;fill:currentColor;flex-shrink:0}

/* ── Separator ── */
.btn-separator{display:flex;align-items:center;gap:12px;margin:14px 0 2px;width:100%;opacity:.4}
.btn-separator::before,.btn-separator::after{content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent)}
.btn-separator span{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;white-space:nowrap}

/* ── Footer ── */
.landing-footer{position:absolute;bottom:20px;left:0;right:0;text-align:center;z-index:10;
  font-size:11px;color:var(--text3);letter-spacing:1.5px;opacity:.35;
  animation:fadeUp .8s 1.2s cubic-bezier(.22,.68,0,1.1) both}
.landing-footer span{color:var(--green-400);font-weight:600}

/* ═══ RESPONSIVE ═══ */
@media (max-width:768px){
  .landing-content{padding:16px 14px}
  .coin-scene{width:170px;height:170px}
  .orbital-ring.r1{width:220px;height:220px}
  .orbital-ring.r2{width:270px;height:270px}
  .orbital-ring.r3{width:320px;height:320px}
  .login-card{padding:22px 20px 26px;border-radius:20px}
  .login-btn{padding:14px 20px;font-size:15px}
}
@media (max-width:480px){
  .coin-scene{width:140px;height:140px}
  .orbital-ring.r1{width:185px;height:185px}
  .orbital-ring.r2{width:230px;height:230px}
  .orbital-ring.r3{width:275px;height:275px}
  .login-card{padding:18px 16px 22px;margin:0 4px}
}
@media (max-height:700px){
  .hero-title{font-size:clamp(32px,6vw,50px);margin-bottom:0}
  .coin-scene{width:150px;height:150px}
  .orbital-ring.r1{width:200px;height:200px}
  .orbital-ring.r2{width:245px;height:245px}
  .orbital-ring.r3{width:290px;height:290px}
  .landing-sub{margin-top:8px}
  .landing-divider{margin:8px auto 10px}
  .login-card{padding:16px 18px 20px}
  .landing-welcome{margin-bottom:2px}
  .landing-flavor{margin-bottom:14px}
}
</style>
</head>
<body>

<div class="landing" id="landingPage">

<script>
// ═══ PARTICLES ═══
(function(){
  const c = document.getElementById('particles');
  if(!c) return;
  for(let i=0;i<35;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random()*100+'%';
    p.style.animationDelay = Math.random()*6+'s';
    p.style.animationDuration = (4+Math.random()*5)+'s';
    const s = 1+Math.random()*2;
    p.style.width = s+'px';
    p.style.height = s+'px';
    if(Math.random()>.6) p.style.background='rgba(34,197,94,0.7)';
    c.appendChild(p);
  }
})();

// ═══ COIN 3D DRAG ═══
(function(){
  const scene = document.getElementById('coinScene');
  const coin = document.getElementById('coin3d');
  if(!scene||!coin) return;
  let dragging=false, lastX=0, lastY=0, rotX=10, rotY=-15;

  function startDrag(x,y){
    dragging=true; lastX=x; lastY=y;
    coin.classList.remove('idle');
    scene.style.cursor='grabbing';
  }
  function moveDrag(x,y){
    if(!dragging) return;
    rotY += (x-lastX)*0.5;
    rotX -= (y-lastY)*0.5;
    rotX = Math.max(-40,Math.min(40,rotX));
    coin.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    lastX=x; lastY=y;
  }
  function endDrag(){
    if(!dragging) return;
    dragging=false;
    scene.style.cursor='grab';
    // Smooth return to idle
    coin.style.transition='transform 1.5s cubic-bezier(.25,.46,.45,.94)';
    coin.style.transform='rotateX(10deg) rotateY(-15deg)';
    setTimeout(()=>{
      coin.style.transition='';
      coin.classList.add('idle');
      rotX=10; rotY=-15;
    },1500);
  }

  scene.addEventListener('mousedown',e=>{e.preventDefault();startDrag(e.clientX,e.clientY)});
  window.addEventListener('mousemove',e=>moveDrag(e.clientX,e.clientY));
  window.addEventListener('mouseup',endDrag);
  scene.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];startDrag(t.clientX,t.clientY)},{passive:false});
  window.addEventListener('touchmove',e=>{const t=e.touches[0];moveDrag(t.clientX,t.clientY)},{passive:true});
  window.addEventListener('touchend',endDrag);
})();

// ═══ PARALLAX (mouse) ═══
(function(){
  const map = document.querySelector('.landing-map');
  if(!map) return;
  map.style.backgroundSize='114% 114%';
  map.style.backgroundPosition='center center';
  map.style.willChange='background-position';

  window.addEventListener('mousemove',e=>{
    const cx=window.innerWidth/2, cy=window.innerHeight/2;
    const dx=(e.clientX-cx)/cx, dy=(e.clientY-cy)/cy;
    const bx=50+dx*3, by=50+dy*3;
    map.style.backgroundPosition=`${bx}% ${by}%`;
  });
})();
