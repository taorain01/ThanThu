<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lang Gia - Danh sách thành viên</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #06120a;
      --panel: #0c1a11;
      --panel-2: #112118;
      --line: rgba(141,255,183,.13);
      --line-strong: rgba(141,255,183,.32);
      --text: #dff2e6;
      --muted: #7aaa8a;
      --green: #3ecf72;
      --green-glow: rgba(62,207,114,.18);
      --gold: #f5c842;
      --gold-dim: rgba(245,200,66,.13);
      --danger: #f07070;
      --dps: #5ea9ff;
      --healer: #4de89a;
      --tanker: #ffad4d;
      --radius: 10px;
      --font: 'Inter', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
    }
    button, input, select { font: inherit; }

    /* ── SHELL: 100vh, no scroll ── */
    .shell {
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow: hidden;
      padding: 10px 12px 8px;
    }

    /* ── TOPBAR ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      padding: 8px 12px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: rgba(10,24,14,.95);
      backdrop-filter: blur(14px);
      margin-bottom: 8px;
    }
    .topbar-title { flex: 1; min-width: 0; }
    .topbar-title h1 {
      font-size: 15px;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: .01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-title .sub {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .icon-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.04);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      transition: .15s;
      flex-shrink: 0;
    }
    body.embed-mode #btnClose { order: 20; }
    .icon-btn:hover { border-color: var(--line-strong); background: var(--green-glow); }
    .btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      border-radius: 8px;
      height: 34px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: .15s;
      white-space: nowrap;
      font-size: 12.5px;
      font-weight: 700;
    }
    .btn:hover { border-color: var(--line-strong); background: var(--green-glow); }
    .btn.primary {
      color: #041007;
      background: linear-gradient(135deg, #5ee895, #22c060);
      border-color: transparent;
    }
    .btn.primary:hover { filter: brightness(1.07); }

    /* ── FILTERS ROW ── */
    .filters-row {
      display: flex;
      gap: 7px;
      flex-shrink: 0;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .filter-group label {
      font-size: 10px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .filter-group.search-group { flex: 1; min-width: 140px; }
    .filter-group.select-group { width: 118px; flex-shrink: 0; }
    input[type="text"], select {
      width: 100%;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0,0,0,.28);
      color: var(--text);
      padding: 0 10px;
      outline: none;
      transition: .15s;
    }
    input[type="text"]:focus, select:focus {
      border-color: var(--line-strong);
      box-shadow: 0 0 0 3px rgba(62,207,114,.08);
    }
    input::placeholder { color: var(--muted); }
    select option { background: #0d1b12; color: var(--text); }

    /* ── STATS BAR ── */
    .stats-bar {
      display: flex;
      gap: 7px;
      flex-shrink: 0;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .stat-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.025);
      font-size: 12px;
    }
    .stat-chip .val {
      font-size: 15px;
      font-weight: 900;
      color: var(--green);
    }
    .stat-chip .lbl { color: var(--muted); font-size: 11px; }
    .stat-chip.dps .val { color: var(--dps); }
    .stat-chip.healer .val { color: var(--healer); }
    .stat-chip.tanker .val { color: var(--tanker); }
    .stat-chip.pending .val { color: var(--gold); }
    .stat-chip.total .val { color: #e2e8f0; }
    .stat-chip.total { border-color: rgba(226,232,240,.2); background: rgba(226,232,240,.04); }

    /* ── STATUS MESSAGE ── */
    .status-msg {
      display: none;
      flex-shrink: 0;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: rgba(255,255,255,.04);
      margin-bottom: 8px;
    }
    .status-msg.show { display: block; }
    .status-msg.error { color: #ffdada; border-color: rgba(240,112,112,.35); background: rgba(240,112,112,.08); }
    .status-msg.ok { color: #c8ffd8; border-color: rgba(62,207,114,.3); background: rgba(62,207,114,.07); }

    /* ── TABLE HEADER ── */
    .table-head {
      display: grid;
      grid-template-columns: 36px minmax(0,1fr) 100px 130px 130px 76px;
      gap: 8px;
      align-items: center;
      padding: 5px 10px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--line);
      margin-bottom: 4px;
    }
    .col-hd {
      font-size: 10px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* ── LIST: scrollable ── */
    .list-wrap {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-right: 2px;
    }
    .list-wrap::-webkit-scrollbar { width: 4px; }
    .list-wrap::-webkit-scrollbar-track { background: transparent; }
    .list-wrap::-webkit-scrollbar-thumb { background: rgba(141,255,183,.18); border-radius: 4px; }
    .list-wrap::-webkit-scrollbar-thumb:hover { background: rgba(141,255,183,.35); }

    /* ── ROW ── */
    .member-row {
      display: grid;
      grid-template-columns: 36px minmax(0,1fr) 100px 130px 130px 76px;
      gap: 8px;
      align-items: start;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(12,26,17,.76);
      transition: border-color .15s, background .15s;
    }
    .member-row:hover { border-color: rgba(141,255,183,.24); background: rgba(15,34,20,.9); }
    .member-row.is-pending { border-color: rgba(245,200,66,.2); background: rgba(245,200,66,.04); }

    /* avatar */
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      background: rgba(62,207,114,.11);
      color: var(--green);
      border: 1px solid rgba(62,207,114,.22);
      flex-shrink: 0;
    }
    .avatar.you { background: rgba(245,200,66,.13); color: var(--gold); border-color: rgba(245,200,66,.3); }

    /* info */
    .info { min-width: 0; }
    .info .name {
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .name-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .info .name .pill { flex-shrink: 0; }
    .name-edit-btn {
      width: 24px;
      height: 24px;
      border: 1px solid rgba(141,255,183,.18);
      border-radius: 7px;
      background: rgba(255,255,255,.035);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: .15s;
      flex-shrink: 0;
    }
    .name-edit-btn:hover {
      color: var(--gold);
      border-color: rgba(245,200,66,.42);
      background: rgba(245,200,66,.1);
      box-shadow: 0 0 0 3px rgba(245,200,66,.06);
    }
    .name-edit-btn svg { width: 13px; height: 13px; }
    .info .meta {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* pill */
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.03);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pill.dps    { color: var(--dps);    border-color: rgba(94,169,255,.32); background: rgba(94,169,255,.07); }
    .pill.healer { color: var(--healer); border-color: rgba(77,232,154,.32); background: rgba(77,232,154,.07); }
    .pill.tanker { color: var(--tanker); border-color: rgba(255,173,77,.32);  background: rgba(255,173,77,.07); }
    .pill.pending{ color: var(--gold);   border-color: rgba(245,200,66,.32); background: rgba(245,200,66,.07); }
    .pill.you    { color: var(--gold);   border-color: rgba(245,200,66,.4);  background: rgba(245,200,66,.1); font-size: 10px; padding: 1px 6px; }
    .pill.owner  { color: #fff; border-color: rgba(255,120,120,.35); background: rgba(255,120,120,.1); }
    .pill.bc     { color: #fff; border-color: rgba(255,120,120,.35); background: rgba(255,120,120,.1); }
    .pill.pbc    { color: var(--gold); border-color: rgba(245,200,66,.3); background: rgba(245,200,66,.08); }
    .pill.kc     { color: var(--green); border-color: rgba(62,207,114,.3); background: rgba(62,207,114,.07); }
    .pill.ql     { color: #a5d8ff; border-color: rgba(165,216,255,.3); background: rgba(165,216,255,.06); }
    .pill.mem    { color: var(--muted); }
    .pill.session-in { color: #c8ffd8; border-color: rgba(62,207,114,.32); background: rgba(62,207,114,.08); }
    .pill.session-out { color: var(--muted); border-color: transparent; background: transparent; font-size: 10px; }
    .joined-stack { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; min-width: 0; }
    .col-position { min-width: 0; overflow: hidden; padding-top: 3px; }
    .col-combat { min-width: 0; overflow: hidden; padding-top: 3px; }
    .col-joined { min-width: 0; padding-top: 3px; }
    .row-actions { display: flex; gap: 5px; align-items: flex-start; justify-content: flex-end; min-width: 0; padding-top: 2px; }
    /* re-align avatar to center even when row stretches */
    .avatar { align-self: center; }
    .info { padding-top: 1px; }

    /* role-edit for self */
    .role-edit { display: flex; gap: 5px; }
    .role-edit select {
      height: 28px;
      font-size: 11px;
      padding: 0 6px;
      border-radius: 6px;
      flex: 1;
      min-width: 0;
    }

    /* actions */
    .act-btn {
      height: 28px;
      padding: 0 9px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: .12s;
      white-space: nowrap;
    }
    .act-btn:hover { border-color: var(--line-strong); background: var(--green-glow); }
    .act-btn.add { color: #041007; background: linear-gradient(135deg,#5ee895,#22c060); border-color: transparent; width: 28px; padding: 0; font-size: 16px; }
    .act-btn.add:disabled { opacity: .35; filter: none; cursor: not-allowed; background: rgba(255,255,255,.06); color: var(--muted); }
    .act-btn.danger { color: #ffc9c9; border-color: rgba(240,112,112,.3); background: rgba(240,112,112,.07); }
    .act-btn.danger:hover { background: rgba(240,112,112,.15); }

    /* edit modal */
    body.modal-open { overflow: hidden; }
    .roster-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0,0,0,.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .roster-modal.show { display: flex; }
    .roster-modal-card {
      width: min(430px, 100%);
      border: 1px solid rgba(141,255,183,.22);
      border-radius: 12px;
      background: linear-gradient(160deg, rgba(13,30,18,.98), rgba(5,13,8,.99));
      box-shadow:
        0 24px 70px rgba(0,0,0,.72),
        0 0 0 1px rgba(255,255,255,.04),
        0 0 40px rgba(62,207,114,.08);
      overflow: hidden;
      transform: translateY(8px) scale(.98);
      opacity: 0;
      transition: transform .18s ease, opacity .18s ease;
    }
    .roster-modal.show .roster-modal-card {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    .roster-modal-card::before {
      content: '';
      display: block;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(245,200,66,.64), rgba(62,207,114,.48), transparent);
    }
    .roster-modal-head {
      padding: 16px 18px 12px;
      border-bottom: 1px solid rgba(141,255,183,.1);
    }
    .roster-modal-title {
      color: var(--gold);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .01em;
    }
    .roster-modal-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      min-height: 17px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .roster-modal-body {
      display: grid;
      gap: 12px;
      padding: 16px 18px 18px;
    }
    .modal-field {
      display: grid;
      gap: 6px;
    }
    .modal-field label {
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .modal-field input {
      width: 100%;
      height: 38px;
      border: 1px solid rgba(141,255,183,.17);
      border-radius: 8px;
      background: rgba(0,0,0,.3);
      color: var(--text);
      padding: 0 11px;
      outline: none;
      transition: .15s;
    }
    .modal-field input:focus {
      border-color: rgba(245,200,66,.52);
      box-shadow: 0 0 0 3px rgba(245,200,66,.09);
      background: rgba(0,0,0,.38);
    }
    .modal-field input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(82%) sepia(60%) saturate(597%) hue-rotate(5deg) brightness(102%) contrast(92%);
      opacity: .85;
      cursor: pointer;
    }
    .roster-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 18px 18px;
      border-top: 1px solid rgba(141,255,183,.1);
    }
    @media (max-width: 520px) {
      .roster-modal { padding: 10px; align-items: flex-end; }
      .roster-modal-card { width: 100%; }
      .roster-modal-actions .btn { flex: 1; justify-content: center; }
    }

    /* empty */
    .empty {
      padding: 32px;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      background: rgba(255,255,255,.015);
    }

    /* ═══ ROSTER LOG — REDESIGN ═══ */
    .log-fab {
      position: fixed;
      right: 16px;
      bottom: 14px;
      z-index: 900;
      height: 38px;
      min-width: 66px;
      padding: 0 14px;
      border: 1px solid rgba(245,200,66,.45);
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(18,40,24,.97), rgba(10,22,14,.99));
      color: var(--gold);
      box-shadow: 0 8px 28px rgba(0,0,0,.55), 0 0 16px rgba(245,200,66,.12), inset 0 1px 0 rgba(255,255,255,.06);
      font-weight: 900;
      font-size: 12.5px;
      letter-spacing: .03em;
      cursor: pointer;
      transition: border-color .18s, box-shadow .18s, transform .14s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .log-fab::before {
      content: '';
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(62,207,114,.8);
      animation: logPulse 2.2s infinite;
    }
    @keyframes logPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .45; transform: scale(.7); }
    }
    .log-fab:hover {
      border-color: rgba(245,200,66,.72);
      box-shadow: 0 12px 36px rgba(0,0,0,.6), 0 0 22px rgba(245,200,66,.2), inset 0 1px 0 rgba(255,255,255,.08);
      transform: translateY(-1px);
    }
    .log-fab[aria-expanded="true"] {
      border-color: rgba(245,200,66,.7);
      background: linear-gradient(135deg, rgba(30,54,26,.98), rgba(14,30,18,.99));
      box-shadow: 0 0 0 3px rgba(245,200,66,.1), 0 8px 28px rgba(0,0,0,.5);
    }

    .log-panel {
      position: fixed;
      right: 16px;
      bottom: 62px;
      z-index: 901;
      width: min(430px, calc(100vw - 24px));
      max-height: min(560px, calc(100vh - 96px));
      display: none;
      flex-direction: column;
      border: 1px solid rgba(62,207,114,.22);
      border-radius: 14px;
      background: rgba(5,14,8,.97);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow:
        0 28px 80px rgba(0,0,0,.72),
        0 0 0 1px rgba(255,255,255,.04),
        0 0 60px rgba(62,207,114,.06);
      overflow: hidden;
      transform-origin: bottom right;
      animation: logPanelIn .18s ease;
    }
    @keyframes logPanelIn {
      from { opacity: 0; transform: scale(.95) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .log-panel.show { display: flex; }

    /* header gradient */
    .log-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 14px 12px;
      background: linear-gradient(135deg, rgba(16,38,22,.95) 0%, rgba(8,20,12,.92) 100%);
      border-bottom: 1px solid rgba(62,207,114,.14);
      position: relative;
      flex-shrink: 0;
    }
    .log-head::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(62,207,114,.32) 40%, rgba(245,200,66,.2) 70%, transparent);
    }
    .log-head-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .log-head-icon {
      width: 34px; height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, rgba(62,207,114,.18), rgba(34,192,96,.08));
      border: 1px solid rgba(62,207,114,.22);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .log-head-text { min-width: 0; }
    .log-title {
      color: var(--gold);
      font-size: 13.5px;
      font-weight: 900;
      letter-spacing: .02em;
    }
    .log-sub {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10.5px;
      opacity: .85;
    }
    .log-close {
      width: 30px; height: 30px;
      border: 1px solid rgba(141,255,183,.14);
      border-radius: 8px;
      background: rgba(255,255,255,.04);
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      font-weight: 400;
      flex-shrink: 0;
      transition: border-color .15s, color .15s, background .15s;
    }
    .log-close:hover {
      border-color: rgba(240,100,100,.4);
      color: #ffa0a0;
      background: rgba(240,100,100,.08);
    }

    /* filters scrollable chip bar */
    .log-filters {
      display: flex;
      gap: 6px;
      padding: 10px 12px 9px;
      border-bottom: 1px solid rgba(62,207,114,.08);
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .log-filters::-webkit-scrollbar { display: none; }
    .log-filter {
      height: 26px;
      padding: 0 11px;

<script>

  const POSITION_LABELS = { owner:'Chủ guild', pbc:'Phó guild', kc:'Kỳ cựu', mem:'Thành viên' };

  let sb = null, currentSession = null, currentDiscordId = '', currentUserName = 'Người dùng';

  let realtimeChannel = null, reloadTimer = null;

  try {

      auth: { flowType:'implicit', autoRefreshToken:true, persistSession:true, detectSessionInUrl:true }
    }) : null;
  } catch(_) { sb = null; }

  const $ = (id) => document.getElementById(id);
  const els = {
    subtitle: $('subtitle'), status: $('statusMsg'), list: $('listWrap'), stats: $('statsBar'),
    filters: $('filtersRow'), tableHead: $('tableHead'), login: $('btnLogin'), reload: $('btnReload'),
    close: $('btnClose'), search: $('searchInput'), statusFilter: $('statusFilter'),

    positionFilter: $('positionFilter'), sessionFilter: $('sessionFilter'),
    sessionFilterGroup: $('sessionFilterGroup'),
    editModal: $('editModal'), editForm: $('editForm'), editTitle: $('editTitle'),
    editSubtitle: $('editSubtitle'), editNameLabel: $('editNameLabel'),
    editJoinedLabel: $('editJoinedLabel'), editGameUsername: $('editGameUsername'),
    editGameUid: $('editGameUid'), editJoinedDate: $('editJoinedDate'),
    editCancel: $('editCancel'), editSave: $('editSave'),

  };

  function esc(v) { return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function cssEscape(v) { return window.CSS?.escape ? CSS.escape(String(v)) : String(v).replace(/["\\]/g, '\\$&'); }
  function normalizeText(v = '') {
    return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[đð]/g,'d').replace(/[^a-z0-9]+/g,' ').trim();
  }
  function normalizePosition(v = 'mem') {
    const k = normalizeText(v);
    if (k==='bc'||k==='bang chu') return 'bc';
    if (k==='pbc'||k==='pho bang chu'||k==='pho guild') return 'pbc';
    if (k==='kc'||k==='ky cuu') return 'kc';
    if (k==='ql'||k==='quan ly') return 'ql';
    if (k==='khong co'||k==='left'||k==='out') return 'left';
    return 'mem';
  }
  function isLeftRow(row) { return Boolean(row?.left_at) || normalizePosition(row?.position) === 'left'; }
  function displayPosition(row = {}) {
    if (String(row?.discord_id || '') === GUILD_OWNER_DISCORD_ID) return 'owner';
    const pos = normalizePosition(row?.position);
    if (pos === 'pbc' || pos === 'kc') return pos;
    return 'mem';
  }
  function positionForUpdate(row = {}) {
    const raw = String(row?.position || '').trim();
    if (raw) return raw;
    return String(row?.discord_id || '') === GUILD_OWNER_DISCORD_ID ? 'bc' : displayPosition(row);
  }
  function isActiveRosterRow(row) {
    if (!row?.discord_id || String(row.discord_id).startsWith('pending_')) return false;
    if (isLeftRow(row)) return false;
    if (Object.prototype.hasOwnProperty.call(row, 'lang_gia_member')) return row.lang_gia_member === true;
    return true;
  }
  function normalizeCombat(v, fallback='') {
    const k = normalizeText(v);
    if (k==='healer') return 'Healer'; if (k==='tanker'||k==='tank') return 'Tanker'; if (k==='dps') return 'DPS'; return fallback;
  }
  function normalizeWeapon(v) {
    const raw = String(v||'').trim(); if (!raw) return '';
    const u = raw.toUpperCase().replace(/[ĐÐ]/g,'D');
    if (WEAPON_ROLES.includes(u)) return u;
    const k = normalizeText(raw);
    if (k.includes('quat')) return 'QD'; if (k.includes('vo danh')) return 'VD'; if (k.includes('song dao')) return 'SD';
    if (k.includes('cuu kiem')||k==='9k') return '9K'; if (k.includes('du roi')) return 'DR'; if (k.includes('hoanh dao')||k.includes('hoang dao')) return 'HD';
    return '';
  }
  function rowCombat(r) { return normalizeCombat(r?.combat_role, normalizeWeapon(r?.weapon_role||r?.sub_role) ? 'DPS' : ''); }
  function rowWeapon(r) { return normalizeWeapon(r?.weapon_role||r?.sub_role); }
  function positionSort(r) { return ({owner:0,pbc:1,kc:2,mem:3})[displayPosition(r)] ?? 9; }
  function isManagerPosition(pos) { return ['bc','pbc','kc','ql'].includes(normalizePosition(pos)); }

  function showStatus(msg, type='') {
    if (!msg) { els.status.className = 'status-msg'; els.status.textContent = ''; return; }
    els.status.className = `status-msg show ${type}`;
    els.status.textContent = msg;
    if (type === 'ok') setTimeout(() => { if (els.status.textContent === msg) showStatus(''); }, 2800);
  }

  const MEMBER_ROSTER_LOG_ACTIONS = new Set([
    'member_update', 'pending_update', 'pending_delete', 'own_role_update', 'session_add_member',
    'pending_add', 'member_add', 'member_rejoin', 'member_edit', 'member_delete',
    'member_bulk_cleanup', 'roster_sync', 'quick_team'
  ]);
  const LOG_ACTION_LABELS = {
    member_update: 'Sua member',
    pending_update: 'Sua pending',
    pending_delete: 'Xoa pending',
    own_role_update: 'Doi role ca nhan',
    session_add_member: 'Them vao session',
    pending_add: 'Them pending',
    member_add: 'Addmem',
    member_rejoin: 'Rejoin',
    member_edit: 'Edit member',
    member_delete: 'Xoa member',
    member_bulk_cleanup: 'Don member',
    roster_sync: 'Sua doi hinh',
    quick_team: 'Lap team nhanh'
  };

  function normalizeLogDetails(details) {
    let value = details;
    for (let i = 0; i < 2 && typeof value === 'string'; i += 1) {
      try { value = JSON.parse(value); } catch (_) { break; }
    }
    return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
  }
  function normalizeLogValue(value) {
    if (value === undefined || value === null || value === '') return '';
    return String(value);
  }
  function buildLogChange(field, label, before, after) {
    const oldValue = normalizeLogValue(before);
    const newValue = normalizeLogValue(after);
    if (oldValue === newValue) return null;
    return { field, label, before: oldValue || null, after: newValue || null };
  }
  function compactLogValue(value) {
    const text = normalizeLogValue(value);
    return text || '-';
  }
  function formatLogTime(value) {
    const date = value ? new Date(value) : null;
    if (!date || Number.isNaN(date.getTime())) return '--:--';
    return date.toLocaleString('vi-VN', {
      timeZone: 'Asia/Bangkok',
      hour12: false,
      day: '2-digit',
      month: '2-digit',
      hour: '2-digit',
      minute: '2-digit'

    const combat = rowCombat(row), weapon = rowWeapon(row);
    const isSelf = String(row.discord_id) === String(currentDiscordId);
    if (isSelf) return `
      <div class="role-edit">
        <select data-action="own-combat" data-id="${esc(row.discord_id)}">
          ${COMBAT_ROLES.map(r => `<option value="${r}" ${combat===r?'selected':''}>${r}</option>`).join('')}
        </select>
        <select data-action="own-weapon" data-id="${esc(row.discord_id)}" ${combat!=='DPS'?'disabled':''}>
          <option value="">—</option>
          ${WEAPON_ROLES.map(r => `<option value="${r}" ${weapon===r?'selected':''}>${WEAPON_LABELS[r]}</option>`).join('')}
        </select>
      </div>`;
    const combatClass = normalizeText(combat);
    return `<div style="display:flex;gap:4px;flex-wrap:wrap;">
      <span class="pill ${combatClass}">${esc(combat||'Chưa chọn')}</span>
      ${weapon ? `<span class="pill">${esc(weapon)}</span>` : ''}
    </div>`;
  }

  function renderNameEditButton(action, id) {
    if (!isManager) return '';
    return `<button class="name-edit-btn" data-action="${action}" data-id="${esc(id)}" title="Sửa thông tin" aria-label="Sửa thông tin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
      </svg>
    </button>`;
  }

  function renderActions(row, type) {
    if (type === 'pending') {
      if (!isManager) return '';
      return `<button class="act-btn danger" data-action="delete-pending" data-id="${esc(row.id)}">Xoá</button>`;
    }
    const inSession = sessionMemberIds.has(String(row.discord_id));
    return `
      ${isManager && SESSION_ID ? `<button class="act-btn add" data-action="add-session" data-id="${esc(row.discord_id)}" ${inSession?'disabled':''} title="Thêm vào session">+</button>` : ''}`;
  }

  function renderActiveRow(row) {
    const pos = displayPosition(row);
    const posClass = pos;
    const initial = String(row.game_username||row.discord_name||'?').trim().charAt(0).toUpperCase();
    const joined = row.joined_at ? new Date(row.joined_at).toLocaleDateString('vi-VN') : '—';
    const isSelf = String(row.discord_id) === String(currentDiscordId);
    const sessionInfo = SESSION_ID ? sessionMemberMap.get(String(row.discord_id)) : null;
    const sessionBadge = SESSION_ID
      ? `<span class="pill ${sessionInfo ? 'session-in' : 'session-out'}">${esc(sessionInfo?.session_label || 'Chua trong session')}</span>`
      : '';
    return `
      <div class="member-row" data-discord-id="${esc(row.discord_id)}">
        <div class="avatar ${isSelf?'you':''}">${esc(initial)}</div>
        <div class="info">
          <div class="name">
            <span class="name-text">${esc(row.game_username||row.discord_name||row.discord_id)}</span>
            ${renderNameEditButton('edit-member', row.discord_id)}
            ${isSelf ? '<span class="pill you">Bạn</span>' : ''}
          </div>
          <div class="meta">${esc(row.discord_name||'Discord?')} • UID: ${esc(row.game_uid||'—')}</div>
        </div>
        <div class="col-position"><span class="pill ${posClass}">${esc(POSITION_LABELS[pos]||'Thành viên')}</span></div>
        <div class="col-combat">${renderRoleControls(row)}</div>
        <div class="col-joined"><div class="joined-stack"><span class="pill">${esc(joined)}</span>${sessionBadge}</div></div>
        <div class="row-actions">${renderActions(row,'active')}</div>
      </div>`;
  }

  function renderPendingRow(row) {
    const initial = String(row.game_username||row.game_uid||'?').trim().charAt(0).toUpperCase();
    const joined = row.joined_at ? new Date(row.joined_at).toLocaleDateString('vi-VN') : '—';
    return `
      <div class="member-row is-pending" data-pending-id="${esc(row.id)}">
        <div class="avatar"><span style="opacity:.6">${esc(initial)}</span></div>
        <div class="info">
          <div class="name">
            <span class="name-text">${esc(row.game_username||'Chờ duyệt')}</span>
            ${renderNameEditButton('edit-pending', row.id)}
            <span class="pill pending">Chờ duyệt</span>
          </div>
          <div class="meta">UID: ${esc(row.game_uid||'—')} • Thêm bởi: ${esc(row.added_by_name||row.added_by||'—')}</div>
        </div>
        <div class="col-position"><span class="pill pending">Chờ ?addmem</span></div>
        <div class="col-combat"><span class="pill">Chưa liên kết Discord</span></div>
        <div class="col-joined"><span class="pill">${esc(joined)}</span></div>
        <div class="row-actions">${renderActions(row,'pending')}</div>
      </div>`;
  }

  function render() {
    renderStats();
    const visible = filteredRows();
    const sessionText = currentSession ? ` • Session ${currentSession.day||''}${currentSession.locked?' (đã chốt)':''}` : '';
    const selfRow = activeRows.find(r => String(r.discord_id) === String(currentDiscordId)) || { discord_id: currentDiscordId, position: 'mem' };
    els.subtitle.textContent = `${currentUserName} • ${POSITION_LABELS[displayPosition(selfRow)] || 'Thành viên'}${sessionText}`;
    if (!visible.length) {
      els.list.innerHTML = '<div class="empty">Không có thành viên nào khớp bộ lọc.</div>'; return;
    }
    els.list.innerHTML = visible.map(item => item.type==='active' ? renderActiveRow(item.row) : renderPendingRow(item.row)).join('');
  }

  function getActiveById(id) { return activeRows.find(r => String(r.discord_id)===String(id))||null; }
  function getPendingById(id) { return pendingRows.find(r => String(r.id)===String(id))||null; }

  async function updateOwnRole(discordId) {
    if (String(discordId) !== String(currentDiscordId)) return;
    const beforeRow = getActiveById(discordId);
    const rowEl = document.querySelector(`[data-discord-id="${cssEscape(discordId)}"]`);
    const combat = rowEl?.querySelector('[data-action="own-combat"]')?.value || 'DPS';
    const weaponSel = rowEl?.querySelector('[data-action="own-weapon"]');
    const weapon = combat==='DPS' ? (weaponSel?.value||null) : null;
    if (weaponSel) weaponSel.disabled = combat !== 'DPS';
    showStatus('Đang cập nhật vai...', '');
    const { error } = await sb.rpc('bc_update_own_pickrole', { p_combat_role:combat, p_weapon_role:weapon });
    if (error) throw error;
    const changes = [
      buildLogChange('combat_role', 'Vai', rowCombat(beforeRow), combat),
      buildLogChange('weapon_role', 'Vu khi', rowWeapon(beforeRow), weapon || '')
    ].filter(Boolean);
    if (changes.length) {
      void recordMemberRosterLog('own_role_update', {
        summary: `Doi role ${beforeRow?.game_username || beforeRow?.discord_name || discordId}`,
        target_type: 'member',
        target_id: String(discordId),
        target_name: beforeRow?.game_username || beforeRow?.discord_name || String(discordId),
        target_uid: beforeRow?.game_uid || null,
        changes
      });
    }
    showStatus('Đã cập nhật vai. Bot sẽ đồng bộ Discord role.', 'ok');
    await loadRoster(false);
  }

  async function editMember(discordId) {
    const row = getActiveById(discordId);
    if (!row || !isManager) return;
    const values = await openEditModal({
      title: 'Sửa thành viên',
      subtitle: row.discord_name || row.discord_id || '',
      nameLabel: 'Tên game',
      joinedLabel: 'Ngày vào guild',
      gameUsername: row.game_username || '',
      gameUid: row.game_uid || '',
      joinedAt: row.joined_at
    });
    if (!values) return;
    showStatus('Đang lưu...', '');
    const changes = [
      buildLogChange('game_username', 'Ten game', row.game_username || '', values.gameUsername || ''),
      buildLogChange('game_uid', 'UID', row.game_uid || '', values.gameUid || ''),
      buildLogChange('joined_at', 'Ngay vao', dateInputValue(row.joined_at), values.joinedDate || '')
    ].filter(Boolean);
    const { error } = await sb.rpc('bc_manager_update_member', {
      p_guild_id:GUILD_ID, p_discord_id:String(discordId),
      p_game_username:values.gameUsername||null, p_game_uid:values.gameUid||null,
      p_position:positionForUpdate(row)||'mem', p_joined_at:joinedDateToIso(values.joinedDate)
    });
    if (error) throw error;
    if (changes.length) {
      void recordMemberRosterLog('member_update', {
        summary: `Sua member ${values.gameUsername || row.game_username || row.discord_name || discordId}`,
        target_type: 'member',
        target_id: String(discordId),
        target_name: values.gameUsername || row.game_username || row.discord_name || String(discordId),
        target_uid: values.gameUid || row.game_uid || null,
        changes
      });
    }
    showStatus('Đã lưu thông tin thành viên.', 'ok');
    await loadRoster(false);
  }

  async function editPending(id) {
    const row = getPendingById(id);
    if (!row || !isManager) return;
    const values = await openEditModal({
      title: 'Sửa thành viên chờ',
      subtitle: row.added_by_name ? `Thêm bởi ${row.added_by_name}` : '',
      nameLabel: 'Tên game',
      joinedLabel: 'Ngày xin vào',
      gameUsername: row.game_username || '',
      gameUid: row.game_uid || '',
      joinedAt: row.joined_at
    });
    if (!values) return;
    showStatus('Đang lưu...', '');
    const changes = [
      buildLogChange('game_username', 'Ten game', row.game_username || '', values.gameUsername || ''),
      buildLogChange('game_uid', 'UID', row.game_uid || '', values.gameUid || ''),
      buildLogChange('joined_at', 'Ngay vao', dateInputValue(row.joined_at), values.joinedDate || '')
    ].filter(Boolean);
    const { error } = await sb.rpc('bc_manager_update_pending', {
      p_guild_id:GUILD_ID, p_id:id, p_game_uid:values.gameUid||null,
      p_game_username:values.gameUsername||null, p_joined_at:joinedDateToIso(values.joinedDate)
    });
    if (error) throw error;
    if (changes.length) {
      void recordMemberRosterLog('pending_update', {
        summary: `Sua pending ${values.gameUsername || row.game_username || row.game_uid || id}`,
        target_type: 'pending',
        target_id: String(id),
        target_name: values.gameUsername || row.game_username || '',
        target_uid: values.gameUid || row.game_uid || null,
        changes
      });
    }
    showStatus('Đã lưu.', 'ok');
    await loadRoster(false);
  }

  async function deletePending(id) {
    const row = getPendingById(id);
    if (!row || !isManager) return;
    if (!window.confirm(`Xoá thành viên đang chờ: ${row.game_username||row.game_uid||id}?`)) return;
    showStatus('Đang xoá...', '');
    const { error } = await sb.rpc('bc_manager_delete_pending', { p_guild_id:GUILD_ID, p_id:id });
    if (error) throw error;
    void recordMemberRosterLog('pending_delete', {
      summary: `Xoa pending ${row.game_username || row.game_uid || id}`,
      target_type: 'pending',
      target_id: String(id),
      target_name: row.game_username || '',
      target_uid: row.game_uid || null,
      changes: [
        { field: 'status', label: 'Trang thai', before: 'pending', after: 'deleted' }
      ]
    });
    showStatus('Đã xoá.', 'ok');
    await loadRoster(false);
  }

  async function updateSessionWithPayload(payload) {
    const applyUpdate = async (nextPayload) => {
      const query = sb.from('bc_sessions').update(nextPayload).eq('guild_id', GUILD_ID).eq('id', SESSION_ID);
      return query.select('*').maybeSingle();
    };

    let { data, error } = await applyUpdate(payload);
    if (error && /(team_layout|teams|teams_json)/i.test(error.message || '')) {
      const retryPayload = { ...payload };
      delete retryPayload.team_layout;
      delete retryPayload.teams;
      delete retryPayload.teams_json;
      const retry = await applyUpdate(retryPayload);
      data = retry.data;
      error = retry.error || null;
      payload = retryPayload;
    }
    if (error && /team_sizes/i.test(error.message || '')) {
      const retryPayload = { ...payload };
      delete retryPayload.team_sizes;
      const retry = await applyUpdate(retryPayload);
      data = retry.data;
      error = retry.error || null;
      payload = retryPayload;
    }
    if (error && /leader_ids/i.test(error.message || '')) {
      const retryPayload = { ...payload };
      delete retryPayload.leader_ids;
      const retry = await applyUpdate(retryPayload);
      data = retry.data;
      error = retry.error || null;
      payload = retryPayload;
    }
    if (error) throw error;
    return data || { ...currentSession, ...payload };
  }

  async function addMemberToSessionDirect(discordId) {
    if (!currentSession) await loadCurrentSession();
    if (!currentSession) throw new Error('Khong tim thay session.');
    const row = getActiveById(discordId);
    if (!row) throw new Error('Khong tim thay thanh vien trong roster.');
    if (collectSessionMembers(currentSession).has(String(discordId))) return currentSession;

    const roster = getSessionRosterState(currentSession);
    let targetTeamId = 'waiting_list';
    if (currentSession.locked !== true) {
      const targetTeam = roster.layout.find(team => cloneList(roster.teams[team.id]).length < (Number(team.capacity) || 0));
      if (targetTeam) targetTeamId = targetTeam.id;
    }

    const participant = buildSessionParticipant(row, targetTeamId);
    if (targetTeamId === 'waiting_list') {
      roster.waitingList.push(participant);
    } else {
      roster.teams[targetTeamId] = roster.teams[targetTeamId] || [];
      roster.teams[targetTeamId].push(participant);
    }

    const teamsPayload = buildTeamsPayloadFromRoster(roster);
    const mirror = buildLegacyMirrorFromRoster(roster);
    const leaderIds = parseLeaderIds(currentSession);
    const payload = {
      team_attack1: JSON.stringify(mirror.team_attack1 || []),
      team_attack2: JSON.stringify(mirror.team_attack2 || []),
      team_defense: JSON.stringify(mirror.team_defense || []),
      team_forest: JSON.stringify(mirror.team_forest || []),
      waiting_list: JSON.stringify(roster.waitingList || []),
      leader_ids: JSON.stringify({
        ...leaderIds,
        editor_id: currentDiscordId,
        editor_name: currentUserName || 'Manager',
        editor_action: 'manager_add_member',
        edited_at: Date.now()
      })
    };
    if (hasOwn(currentSession, 'team_layout')) payload.team_layout = encodeExistingJsonField(currentSession, 'team_layout', roster.layout);
    if (hasOwn(currentSession, 'teams')) payload.teams = encodeExistingJsonField(currentSession, 'teams', teamsPayload);
    if (hasOwn(currentSession, 'teams_json')) payload.teams_json = encodeExistingJsonField(currentSession, 'teams_json', teamsPayload);
    if (hasOwn(currentSession, 'team_sizes')) payload.team_sizes = JSON.stringify(buildTeamSizesFromLayout(roster.layout));

    return updateSessionWithPayload(payload);
  }

  async function addMemberToSession(discordId) {
    if (!SESSION_ID || !isManager) return;
    const row = getActiveById(discordId);
    showStatus('Đang thêm vào session...', '');
    const { data, error } = await sb.rpc('bc_manager_add_member_to_session', { p_session_id:SESSION_ID, p_discord_id:String(discordId) });
    if (error && isMissingTeamsFieldError(error)) {
      currentSession = await addMemberToSessionDirect(discordId);
    } else if (error) {
      throw error;
    } else {
      currentSession = data || currentSession;
    }
    sessionMemberMap = collectSessionMembers(currentSession);
    sessionMemberIds = new Set(sessionMemberMap.keys());
    activeRows = activeRows.map(hydrateRowFromSession);
    const sessionInfo = sessionMemberMap.get(String(discordId));
    void recordMemberRosterLog('session_add_member', {
      summary: `Them ${row?.game_username || row?.discord_name || discordId} vao session`,
      target_type: 'member',
      target_id: String(discordId),
      target_name: row?.game_username || row?.discord_name || String(discordId),
      target_uid: row?.game_uid || null,
      session_id: SESSION_ID,
      day: CURRENT_DAY || currentSession?.day || null,
      changes: [
        { field: 'session_team', label: 'Session', before: 'none', after: sessionInfo?.session_label || sessionInfo?.session_team || 'waiting_list' }
      ]
    });
    showStatus(sessionMemberIds.has(String(discordId)) ? 'Đã thêm vào đội hình.' : 'Đã đưa vào hàng chờ.', 'ok');
    window.parent?.postMessage({ type:'memberRosterSessionUpdated', sessionId:SESSION_ID }, '*');
    render();
  }

  function scheduleReload() {
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(() => loadRoster(false).catch(e => showStatus(e.message||String(e),'error')), 200);
  }

  function setupRealtime() {
    if (!sb || realtimeChannel) return;
    realtimeChannel = sb.channel(`member-roster-${GUILD_ID}`)
      .on('postgres_changes', { event:'*', schema:'public', table:'bc_users', filter:`guild_id=eq.${GUILD_ID}` }, scheduleReload)
      .on('postgres_changes', { event:'*', schema:'public', table:'bc_pending_ids', filter:`guild_id=eq.${GUILD_ID}` }, scheduleReload)
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'bc_logs', filter:`guild_id=eq.${GUILD_ID}` }, () => {
        if (logPanelOpen) scheduleLogReload();
      });
    if (SESSION_ID) {
      realtimeChannel.on('postgres_changes', { event:'*', schema:'public', table:'bc_sessions', filter:`guild_id=eq.${GUILD_ID}` }, payload => {
        const id = payload.new?.id || payload.old?.id;
        if (String(id) === String(SESSION_ID)) scheduleReload();
      });
    }
    realtimeChannel.subscribe();
  }

  async function init() {
    if (!sb) { showStatus('Không khởi tạo được Supabase client.', 'error'); return; }
    if (!IS_EMBED) els.close.textContent = '←';
    if (DEFAULT_MODE === 'add' && SESSION_ID) els.statusFilter.value = 'active';
    await loadRoster(true);
    setupRealtime();
  }

  els.login.addEventListener('click', loginDiscord);
  els.reload.addEventListener('click', () => loadRoster(true).catch(e => showStatus(e.message||String(e),'error')));
  els.close.addEventListener('click', () => {
    if (IS_EMBED) window.parent?.postMessage({ type:'memberRosterClose' }, '*');
    else history.length > 1 ? history.back() : window.close();
  });
  ['input','change'].forEach(ev => {
    [els.search, els.statusFilter, els.combatFilter, els.weaponFilter, els.positionFilter, els.sessionFilter].forEach(el => el.addEventListener(ev, render));
  });
  els.editCancel.addEventListener('click', () => closeEditModal(null));
  els.editForm.addEventListener('submit', ev => {
    ev.preventDefault();
    if (!editModalResolve) return;
    closeEditModal(readEditModalValues());
  });
  els.editModal.addEventListener('click', ev => {
    if (ev.target === els.editModal) closeEditModal(null);
  });
  els.logFab?.addEventListener('click', () => {
    if (logPanelOpen) closeRosterLogPanel();
    else openRosterLogPanel();
  });
  els.logClose?.addEventListener('click', closeRosterLogPanel);
  els.logFilters?.addEventListener('click', ev => {
    const btn = ev.target.closest('[data-log-filter]');
    if (!btn) return;
    logFilter = btn.dataset.logFilter || 'all';
    els.logFilters.querySelectorAll('.log-filter').forEach(item => item.classList.toggle('active', item === btn));
    renderRosterLogEntries();
  });
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Escape') return;
    if (editModalResolve) {
      ev.preventDefault();
      closeEditModal(null);
      return;
    }
    if (logPanelOpen) {
      ev.preventDefault();
      closeRosterLogPanel();
    }
  });
  document.addEventListener('click', async ev => {
    if (ev.target.closest('#btnLoginPanel')) return loginDiscord();
    if (logPanelOpen && !ev.target.closest('#rosterLogPanel') && !ev.target.closest('#btnRosterLog')) {
      closeRosterLogPanel();
    }
    const btn = ev.target.closest('[data-action]');
    if (!btn || btn.tagName === 'SELECT') return;
    try {
      const a = btn.dataset.action, id = btn.dataset.id;
      if (a==='edit-member') await editMember(id);
      if (a==='edit-pending') await editPending(id);
      if (a==='delete-pending') await deletePending(id);
      if (a==='add-session') await addMemberToSession(id);
    } catch(e) { showStatus(e.message||String(e),'error'); }
  });
  document.addEventListener('change', async ev => {
    const el = ev.target.closest('[data-action="own-combat"],[data-action="own-weapon"]');
    if (!el) return;
    try { await updateOwnRole(el.dataset.id); } catch(e) { showStatus(e.message||String(e),'error'); await loadRoster(false).catch(()=>null); }
  });
  window.addEventListener('beforeunload', () => {
    clearTimeout(logReloadTimer);
    if (realtimeChannel && sb) sb.removeChannel(realtimeChannel);
  });

  init().catch(e => showStatus(e.message||String(e),'error'));
</script>
