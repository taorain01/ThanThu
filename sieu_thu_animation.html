<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đấu Trường Siêu Thú Chibi - Trình Diễn Hoạt Ảnh Khung Hình Thực Tế</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #06080e;
      --panel-bg: rgba(14, 18, 33, 0.9);
      --panel-border: rgba(255, 255, 255, 0.1);
      --accent-color: #ff5e36;
      --accent-glow: rgba(255, 94, 54, 0.6);
      --accent-gold: #ffd166;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Nunito', 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(255, 94, 54, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(0, 210, 211, 0.12) 0%, transparent 40%);
    }

    /* HEADER */
    header {
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(6, 8, 14, 0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--panel-border);
      z-index: 50;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff5e36, #ff9f43);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 15px rgba(255, 94, 54, 0.4);
    }

    .logo-text h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, #ffd166);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-header {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 7px 16px;
      border-radius: 14px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-header:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-header.btn-accent {
      background: linear-gradient(135deg, #ff5e36, #ff9f43);
      border: none;
      color: #fff;
    }

    /* MAIN CONTAINER */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 300px 1fr 330px;
      gap: 16px;
      padding: 16px 24px;
      max-width: 1720px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 1200px) {
      main { grid-template-columns: 1fr; }
    }

    .glass-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .panel-title {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
    }

    /* BEAST LIST */
    .beast-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .beast-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      transition: all 0.2s;
    }

    .beast-card:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(4px);
    }

    .beast-card.active {
      border-color: var(--accent-color);
      background: linear-gradient(135deg, rgba(255, 94, 54, 0.18), rgba(255, 255, 255, 0.03));
      box-shadow: 0 2px 14px var(--accent-glow);
    }

    .beast-thumb-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #111422;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .beast-thumb-box img {
      width: 90%;
      height: 90%;
      object-fit: contain;
    }

    /* ARENA STAGE */
    .arena-container {
      position: relative;
      background: radial-gradient(circle at 50% 35%, #161b30 0%, #070912 80%);
      border-radius: 24px;
      border: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.85);
    }

    #arenaCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    .arena-hud {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }

    .hud-box {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: auto;
    }

    /* ACTION BUTTONS */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-frame-act {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 12px 10px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .btn-frame-act:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    .btn-frame-act.active {
      border-color: var(--accent-color);
      background: var(--accent-color);
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <div class="logo-badge">🐾</div>
      <div class="logo-text">
        <h1>ĐẤU TRƯỜNG SIÊU THÚ - HOẠT ẢNH THỰC TẾ</h1>
        <p>100% Nền Trong Suốt • Khung Hình Diễn Xuất Thực Tế • Chuẩn Game 2D</p>
      </div>
    </div>
    <div class="header-actions">
      <a href="sieu_thu_studio.html" class="btn-header btn-accent" style="text-decoration: none;">
        <span>🎬</span> Mở Studio Hoạt Ảnh Khung Hình
      </a>
    </div>
  </header>

  <main>
    <!-- LEFT: DANH SÁCH 5 MẪU SIÊU THÚ -->
    <aside class="glass-panel">
      <div class="panel-title">
        <span>📖</span> Danh Sách Siêu Thú
      </div>
      <div class="beast-list" id="beastList">
        <!-- Render 5 Beasts -->
      </div>
    </aside>

    <!-- CENTER: ARENA CANVAS -->
    <main class="arena-container" id="arenaBox">
      <div class="arena-hud">
        <div class="hud-box">
          <h2 id="hudBeastName" style="font-size:17px; font-weight:800; color:#fff;">Hỏa Long Mini</h2>
          <p id="hudBeastTitle" style="font-size:11px; color:var(--text-sub);">Hệ Hỏa • Cổ Đại</p>
        </div>
        <div class="hud-box" id="hudActionName" style="color:var(--accent-gold); font-size:12px; font-weight:800;">
          ✨ Frame 1/4: Đang Thở (Idle)
        </div>
      </div>
      <canvas id="arenaCanvas"></canvas>
    </main>

    <!-- RIGHT: ACTION CONTROLS -->
    <aside class="glass-panel">
      <div class="panel-title">
        <span>🎮</span> Điều Khiển Khung Hình
      </div>
      <div class="action-grid">
        <button class="btn-frame-act active" onclick="setPlayMode('loop')">
          <span style="font-size:20px;">🔄</span>
          <span>Phát Liên Tục (Loop)</span>
        </button>
        <button class="btn-frame-act" onclick="jumpToFrame(0)">
          <span style="font-size:20px;">🧘</span>
          <span>Frame 1: Đứng Thở</span>
        </button>
        <button class="btn-frame-act" onclick="jumpToFrame(1)">
          <span style="font-size:20px;">💨</span>
          <span>Frame 2: Lấy Đà</span>
        </button>
        <button class="btn-frame-act" onclick="jumpToFrame(2)">
          <span style="font-size:20px;">💥</span>
          <span>Frame 3: Tung Chiêu</span>
        </button>
        <button class="btn-frame-act" style="grid-column: span 2;" onclick="jumpToFrame(3)">
          <span style="font-size:20px;">💖</span>
          <span>Frame 4: Nhảy Mừng Chiến Thắng</span>
        </button>
      </div>

      <div class="panel-title" style="margin-top: 8px;">
        <span>🖼️ Sprite Sheet Game</span>
      </div>
      <div style="width:100%; height:130px; border-radius:12px; background:#0d101c; overflow:hidden; border:1px solid var(--panel-border); display:flex; align-items:center; justify-content:center;">
        <img id="imgSheetThumb" src="anh/sieu_thu/fire_dragon_spritesheet.png" style="width:100%; height:100%; object-fit:contain;" alt="Sheet">
      </div>
    </aside>
  </main>

  <script>
    const BEASTS_DATA = [
      {
        id: 'fire_dragon',
        name: 'Hỏa Long Mini',
        title: 'Hệ Hỏa • Cổ Đại',
        color: '#ff4757',
        glow: 'rgba(255, 71, 87, 0.5)',
        sheetSrc: 'anh/sieu_thu/fire_dragon_spritesheet.png',
        frames: [
          'anh/sieu_thu/fire_dragon_f1.png',
          'anh/sieu_thu/fire_dragon_f2.png',
          'anh/sieu_thu/fire_dragon_f3.png',
          'anh/sieu_thu/fire_dragon_f4.png'
        ],
        desc: ['F1: Đứng thở', 'F2: Hít sâu ngực phồng', 'F3: Phun quả cầu lửa cực đại', 'F4: Nhảy cẫng mừng rỡ']
      },
      {
        id: 'thunder_fox',
        name: 'Lôi Hồ Tia Chớp',
        title: 'Hệ Lôi • Tốc Độ',
        color: '#feca57',
        glow: 'rgba(254, 202, 87, 0.5)',
        sheetSrc: 'anh/sieu_thu/thunder_fox_spritesheet.png',
        frames: [
          'anh/sieu_thu/thunder_fox_f1.png',
          'anh/sieu_thu/thunder_fox_f2.png',
          'anh/sieu_thu/thunder_fox_f3.png',
          'anh/sieu_thu/thunder_fox_f4.png'
        ],
        desc: ['F1: Đứng tích điện', 'F2: Lao nhanh vút tới', 'F3: Phóng bão sét giật neon', 'F4: Nhảy tưng mừng rỡ']
      },
      {
        id: 'water_turtle',
        name: 'Thủy Quy Pha Lê',
        title: 'Hệ Thủy • Hồi Phục',
        color: '#00d2d3',
        glow: 'rgba(0, 210, 211, 0.5)',
        sheetSrc: 'anh/sieu_thu/water_turtle_spritesheet.png',
        frames: [
          'anh/sieu_thu/water_turtle_f1.png',
          'anh/sieu_thu/water_turtle_f2.png',
          'anh/sieu_thu/water_turtle_f3.png',
          'anh/sieu_thu/water_turtle_f4.png'
        ],
        desc: ['F1: Đứng bọt nước', 'F2: Thu mình giọt nước tạo khiên', 'F3: Phun sóng thần cuộn trào', 'F4: Bật nhảy vui vẻ']
      },
      {
        id: 'plant_golem',
        name: 'Mộc Linh Thú',
        title: 'Hệ Mộc • Rừng Xanh',
        color: '#1dd1a1',
        glow: 'rgba(29, 209, 161, 0.5)',
        sheetSrc: 'anh/sieu_thu/plant_golem_spritesheet.png',
        frames: [
          'anh/sieu_thu/plant_golem_f1.png',
          'anh/sieu_thu/plant_golem_f2.png',
          'anh/sieu_thu/plant_golem_f3.png',
          'anh/sieu_thu/plant_golem_f4.png'
        ],
        desc: ['F1: Đứng nụ hoa', 'F2: Hoa sen đá nở bung phát sáng', 'F3: Triệu hồi bão lá xoáy', 'F4: Nhảy ôm hoa']
      },
      {
        id: 'shadow_dragon',
        name: 'Dạ Ảnh Long',
        title: 'Hệ Ám • Hư Không',
        color: '#a55eea',
        glow: 'rgba(165, 94, 234, 0.5)',
        sheetSrc: 'anh/sieu_thu/shadow_dragon_spritesheet.png',
        frames: [
          'anh/sieu_thu/shadow_dragon_f1.png',
          'anh/sieu_thu/shadow_dragon_f2.png',
          'anh/sieu_thu/shadow_dragon_f3.png',
          'anh/sieu_thu/shadow_dragon_f4.png'
        ],
        desc: ['F1: Sừng tím dạ quang', 'F2: Dang cánh dơi bay lên', 'F3: Phun hố đen bóng đêm', 'F4: Bay lượn siêu ngầu']
      }
    ];

    let currentBeastIdx = 0;
    let currentFrameIdx = 0;
    let isLooping = true;
    let loopTimer = null;
    const loadedImages = {};

    const canvas = document.getElementById('arenaCanvas');
    const ctx = canvas.getContext('2d');

    function preloadAll() {
      BEASTS_DATA.forEach(b => {
        b.frames.forEach(src => {
          if (!loadedImages[src]) {
            const img = new Image();
            img.src = src;
            loadedImages[src] = img;
          }
        });
      });
    }
    preloadAll();

    function resizeCanvas() {
      const container = document.getElementById('arenaBox');
      canvas.width = container.offsetWidth;
      canvas.height = container.offsetHeight;
      drawFrame();
    }
    window.addEventListener('resize', resizeCanvas);

    function selectBeast(idx) {
      currentBeastIdx = idx;
      currentFrameIdx = 0;
      const b = BEASTS_DATA[idx];

      document.documentElement.style.setProperty('--accent-color', b.color);
      document.documentElement.style.setProperty('--accent-glow', b.glow);

      document.getElementById('hudBeastName').textContent = b.name;
      document.getElementById('hudBeastTitle').textContent = b.title;
      document.getElementById('imgSheetThumb').src = b.sheetSrc;

      document.querySelectorAll('.beast-card').forEach((c, i) => c.classList.toggle('active', i === idx));

      drawFrame();
    }

    function renderList() {
      const container = document.getElementById('beastList');
      container.innerHTML = '';
      BEASTS_DATA.forEach((b, idx) => {
        const card = document.createElement('div');
        card.className = 'beast-card' + (idx === currentBeastIdx ? ' active' : '');
        card.innerHTML = `
          <div class="beast-thumb-box">
            <img src="${b.frames[0]}" alt="${b.name}">
          </div>
          <div>
            <h4 style="font-size:14px; color:#fff;">${b.name}</h4>
            <span style="font-size:11px; color:${b.color}; font-weight:700;">${b.title}</span>
          </div>
        `;
        card.onclick = () => selectBeast(idx);
        container.appendChild(card);
      });
    }

    function drawFrame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const beast = BEASTS_DATA[currentBeastIdx];
      const frameSrc = beast.frames[currentFrameIdx];
      const img = loadedImages[frameSrc];

      const size = Math.min(canvas.width, canvas.height) * 0.72;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2 + 20;

      // 1. Sàn đấu 3D
      ctx.save();
      ctx.translate(cx, cy + size * 0.42);
      ctx.scale(1, 0.3);
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.45, 0, Math.PI * 2);
      ctx.fillStyle = beast.glow;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      // 2. Vẽ Frame ảnh thực tế (100% trong suốt)
      if (img && img.complete) {
        ctx.save();
        ctx.shadowColor = beast.glow;
        ctx.shadowBlur = 30;
        ctx.drawImage(img, cx - size / 2, cy - size / 2, size, size);
        ctx.restore();
      }

      document.getElementById('hudActionName').textContent = `✨ ${beast.desc[currentFrameIdx]}`;
    }

    function startLoop() {
      if (loopTimer) clearInterval(loopTimer);
      loopTimer = setInterval(() => {
        if (!isLooping) return;
        const b = BEASTS_DATA[currentBeastIdx];
        currentFrameIdx = (currentFrameIdx + 1) % b.frames.length;
        drawFrame();
      }, 300); // 3.3 FPS
    }

    function jumpToFrame(idx) {
      isLooping = false;
      currentFrameIdx = idx;
      document.querySelectorAll('.btn-frame-act').forEach((btn, i) => btn.classList.toggle('active', i === idx + 1));
      drawFrame();
    }

    function setPlayMode(mode) {
      isLooping = true;
      document.querySelectorAll('.btn-frame-act').forEach((btn, i) => btn.classList.toggle('active', i === 0));
    }

    window.onload = () => {
      resizeCanvas();
      renderList();
      selectBeast(0);
      startLoop();
    };
  </script>
</body>
</html>
